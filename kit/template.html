<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paul Times">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>The Paul Times · {{ISSUE_LABEL}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
/* Layout: one phone screen per page, pages side by side, swipe left/right (scroll-snap). Broadsheet type, one accent per section. */
:root {
  --bg: #f4f1ea; --ink: #16130f; --muted: #5f584d; --rule: #c9c1b2; --card: #ebe6db; --plate: #f7f3ea;
  --up: #1d6b2f; --down: #a3201d;
  --a-front: #8a1c1c; --a-world: #8a1c1c; --a-france: #33409a; --a-local: #2e6b66; --a-markets: #1f4e79; --a-crypto: #a55a15;
  --a-tech: #5a3f8a; --a-craft: #a8441a; --a-sport: #23703a; --a-week: #7a5c00; --a-back: #4f4a42;
  --display: "Playfair Display", "Iowan Old Style", Georgia, serif;
  --body: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --accent: var(--a-front);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #181613; --ink: #ece6da; --muted: #a79f90; --rule: #3d3832; --card: #23201b; --plate: #efe9dc;
  --up: #6cc485; --down: #ee7d76;
  --a-front: #e3817c; --a-world: #e3817c; --a-france: #9ea7f2; --a-local: #72bdb4; --a-markets: #82acd9; --a-crypto: #e2a464;
  --a-tech: #ad97d9; --a-craft: #e88e67; --a-sport: #74c48c; --a-week: #d8b552; --a-back: #b9b1a3;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #181613; --ink: #ece6da; --muted: #a79f90; --rule: #3d3832; --card: #23201b; --plate: #efe9dc;
  --up: #6cc485; --down: #ee7d76;
  --a-front: #e3817c; --a-world: #e3817c; --a-france: #9ea7f2; --a-local: #72bdb4; --a-markets: #82acd9; --a-crypto: #e2a464;
  --a-tech: #ad97d9; --a-craft: #e88e67; --a-sport: #74c48c; --a-week: #d8b552; --a-back: #b9b1a3;
  color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; overflow: hidden; -webkit-text-size-adjust: 100%; }
#src { display: none; }

/* reader */
#app { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; display: flex; flex-direction: column; box-sizing: border-box; padding-top: calc(env(safe-area-inset-top, 0px) + 18px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
#bar { position: relative; flex: none; height: 3px; background: var(--rule); }
#bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); transition: width .2s, background .2s; }
#reader { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; }
#reader::-webkit-scrollbar { display: none; }
.page { flex: 0 0 100%; width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; box-sizing: border-box; }
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px max(18px, env(safe-area-inset-right, 0px)) 6px max(18px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--rule); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.ph .mast-s { font-family: var(--display); font-weight: 700; letter-spacing: .04em; text-transform: none; font-size: 14px; }
.ph .where { color: var(--accent); font-weight: 700; white-space: nowrap; }
.pb { flex: 1; min-height: 0; overflow: hidden; padding: 14px max(18px, env(safe-area-inset-right, 0px)) 8px max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
.pb.overflow, .mode-scroll .pb { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pf { display: flex; justify-content: space-between; align-items: center; padding: 6px max(18px, env(safe-area-inset-right, 0px)) 10px max(18px, env(safe-area-inset-left, 0px)); font-size: 12px; color: var(--muted); border-top: 1px solid var(--rule); }
.pf button { font: inherit; color: var(--accent); background: none; border: 0; padding: 6px 4px; cursor: pointer; font-weight: 700; letter-spacing: .06em; }
.pf button:disabled { color: var(--rule); }
.pf .num { font-family: var(--display); font-size: 14px; color: var(--ink); }
.pb > * { flex-shrink: 0; }

/* typography */
h1, h2, h3, h4 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.12; }
p { margin: 0; text-wrap: pretty; hyphens: auto; }
.blk > p + p { margin-top: 10px; }
.kicker { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.opener { border-bottom: 3px solid var(--ink); padding-bottom: 6px; display: flex; align-items: flex-end; gap: 10px; }
.opener .n { font-family: var(--display); font-size: 44px; line-height: .8; color: var(--accent); }
.opener h2 { font-size: 34px; letter-spacing: -.01em; }
.opener + .tagline { margin-top: -4px; }
.tagline { font-style: italic; color: var(--muted); font-size: 15px; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
.head h3 { font-size: 25px; letter-spacing: -.01em; }
.brief h4 { font-size: 19px; margin-bottom: 4px; }
.brief { border-bottom: 1px solid var(--rule); padding-bottom: 12px; }
.inbrief { background: var(--card); border-top: 2px solid var(--ink); padding: 8px 12px; font-size: 16px; }
.inbrief b.l { display: block; color: var(--accent); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
.drop::first-letter { font-family: var(--display); font-weight: 700; float: left; font-size: 56px; line-height: .82; padding: 6px 7px 0 0; color: var(--accent); }
.jump { text-align: right; color: var(--accent); font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.small { font-size: 14.5px; color: var(--muted); }
.note { font-size: 13px; font-style: italic; color: var(--muted); }
figure { margin: 0; }
.plate { background: var(--plate); border-radius: 2px; padding: 6px; }
.plate img { display: block; width: 100%; height: auto; }
figcaption { font-size: 13.5px; line-height: 1.4; color: var(--muted); border-bottom: 1px solid var(--ink); padding: 6px 0 8px; }
figcaption b { font-family: var(--display); color: var(--ink); }
figcaption .cr { font-style: italic; }
.pull { border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 12px 4px; text-align: center; }
.pull p { font-style: italic; font-size: 22px; line-height: 1.3; }
.pull .q { font-family: var(--display); color: var(--accent); font-size: 40px; line-height: .6; display: block; height: 18px; }
.pull .who { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.box { border: 1px solid var(--ink); background: var(--card); padding: 12px 14px; }
.box h4 { font-size: 19px; border-bottom: 1px solid var(--ink); padding-bottom: 4px; margin-bottom: 8px; }
.box.inv { background: var(--ink); color: var(--bg); }
.box.inv h4 { border-color: var(--bg); }
.fun { border: 1px solid var(--accent); border-top: 6px solid var(--accent); background: var(--card); padding: 10px 14px 12px; }
.fun .lbl { display: block; color: var(--accent); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
.fun .big { font-family: var(--display); font-weight: 900; font-size: 48px; line-height: 1; color: var(--accent); display: block; }
.fun .word { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.05; display: block; }
.fun .pron { font-style: italic; color: var(--muted); font-size: 15px; display: block; margin-bottom: 6px; }
.fun .yr { font-family: var(--display); font-weight: 700; color: var(--accent); margin-right: 4px; }
.fun p + p { margin-top: 8px; }
.fun .q { font-style: italic; font-size: 20px; line-height: 1.35; display: block; margin: 4px 0 8px; }
code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--bg); padding: 0 3px; overflow-wrap: anywhere; }
.verdict { border-left: 4px solid var(--accent); padding-left: 10px; font-style: italic; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; border-bottom: 1.5px solid var(--ink); padding: 4px 4px; }
td { border-bottom: 1px solid var(--rule); padding: 5px 4px; }
.r { text-align: right; } .up { color: var(--up); } .down { color: var(--down); }

/* front */
.teasers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.teaser { border-top: 4px solid var(--accent); background: var(--card); padding: 6px 9px 8px; font-size: 13.5px; line-height: 1.3; text-align: left; font-family: var(--body); color: var(--ink); border-left: 0; border-right: 0; border-bottom: 0; cursor: pointer; }
.teaser .pg { color: var(--accent); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; display: block; }
.teaser .t { font-family: var(--display); font-size: 16px; font-weight: 700; display: block; margin: 2px 0; }
.mast { text-align: center; border-bottom: 1px solid var(--ink); padding-bottom: 6px; }
.mast .meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--ink); padding-bottom: 4px; margin-bottom: 4px; }
.mast .name { font-family: var(--display); font-weight: 900; font-size: clamp(40px, 12.5vw, 64px); line-height: 1; letter-spacing: -.02em; }
.mast .motto { font-style: italic; font-size: 13px; color: var(--muted); margin-top: 2px; }
.mast .rail { border-top: 3px double var(--ink); margin-top: 6px; padding-top: 4px; font-size: 10px; letter-spacing: .16em; }
.lead h1 { font-size: 31px; letter-spacing: -.015em; text-align: center; }
.lead .dek { font-style: italic; color: var(--muted); text-align: center; margin-top: 6px; font-size: 17px; }
.five p { padding-left: 22px; text-indent: -22px; font-size: 16px; }
.five p + p { margin-top: 6px; }
.five b { font-family: var(--display); color: var(--accent); display: inline-block; width: 22px; text-indent: 0; }
.toc { display: grid; gap: 0; }
.toc button { all: unset; display: flex; justify-content: space-between; border-bottom: 1px dotted var(--rule); padding: 8px 2px; cursor: pointer; font-size: 16px; }
.toc button span:last-child { font-family: var(--display); font-weight: 700; }
.toc button:focus-visible, .teaser:focus-visible, .pf button:focus-visible, .modes button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.modes { display: flex; border: 1px solid var(--ink); }
.modes button { flex: 1; font: inherit; font-size: 14px; padding: 9px 6px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
.hint { text-align: center; font-size: 13px; color: var(--muted); font-style: italic; }

/* weather + strip + timeline */
.wx { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.wx h5 { font-family: var(--display); font-size: 17px; margin: 0; border-top: 2px solid var(--ink); padding-top: 4px; }
.wx .t { font-family: var(--display); font-size: 36px; line-height: 1; }
.wx table { font-size: 13.5px; }
.wx td { padding: 3px 2px; }
.strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.match { border: 1px solid var(--ink); text-align: center; font-size: 12.5px; padding: 4px 2px; line-height: 1.25; }
.match b { font-family: var(--display); font-size: 22px; display: block; }
.match.win { background: var(--ink); color: var(--bg); }
.match.nx { border-style: dashed; color: var(--muted); }
.tl { list-style: none; margin: 0; padding: 0 0 0 4px; }
.tl li { position: relative; padding: 0 0 12px 22px; border-left: 2px solid var(--rule); }
.tl li:last-child { border-color: transparent; }
.tl li::before { content: ""; position: absolute; left: -7px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--ink); }
.tl li.hot::before { background: var(--accent); border-color: var(--accent); }
.tl .d { font-family: var(--display); font-weight: 700; font-size: 15px; display: block; }
.tl .d em { font-style: normal; color: var(--accent); }

/* sudoku */
.sdk { border: 1px solid var(--ink); background: var(--card); padding: 12px; text-align: center; }
.sdk .tt { font-family: var(--display); font-weight: 700; font-size: 24px; }
.grid { display: grid; grid-template-columns: repeat(9, 1fr); width: min(100%, 360px); margin: 10px auto 10px; border: 2.5px solid var(--ink); background: var(--bg); }
.grid > * { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-family: var(--display); font-size: clamp(16px, 5vw, 21px); box-sizing: border-box; min-width: 0; }
.grid > :nth-child(9n+3), .grid > :nth-child(9n+6) { border-right: 2.5px solid var(--ink); }
.grid > :nth-child(n+19):nth-child(-n+27), .grid > :nth-child(n+46):nth-child(-n+54) { border-bottom: 2.5px solid var(--ink); }
.grid .g { font-weight: 700; color: var(--ink); background: var(--card); }
.grid input { width: 100%; height: 100%; border: 0; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: transparent; text-align: center; font: inherit; color: var(--accent); padding: 0; border-radius: 0; caret-color: var(--accent); }
.grid input:focus { outline: none; background: color-mix(in srgb, var(--accent) 16%, transparent); }
.grid input.bad { color: var(--down); background: color-mix(in srgb, var(--down) 14%, transparent); }
.sdk .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.sdk .btns button { font: inherit; font-size: 14px; padding: 7px 12px; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); cursor: pointer; }
.sdk .msg { font-size: 14px; min-height: 20px; margin-top: 6px; color: var(--accent); font-weight: 600; }
.sources p { font-size: 13.5px; color: var(--muted); }
.sources p + p { margin-top: 6px; }

/* photos from Wikimedia Commons, loaded on the phone */
/* live weather */
.wxl .live { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; border-bottom: 1px solid var(--ink); padding-bottom: 4px; margin-bottom: 10px; }
.wxl .verdict { padding: 10px 12px; margin-bottom: 10px; border: 2px solid var(--ink); }
.wxl .verdict.yes { background: var(--ink); color: var(--bg); }
.wxl .verdict.no { border-color: var(--up); }
.wxl .verdict .v { font-family: var(--display); font-size: 25px; font-weight: 700; line-height: 1.15; }
.wxl .verdict.no .v { color: var(--up); }
.wxl .verdict .why { font-size: 15px; margin-top: 4px; line-height: 1.35; }
.wxl .now { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.wxl .now .t { font-family: var(--display); font-size: 40px; line-height: 1; }
.wxl .now .d { font-size: 15px; color: var(--muted); font-style: italic; }
.wxl ul.facts { list-style: none; padding: 0; margin: 0 0 10px; font-size: 15px; }
.wxl ul.facts li { padding: 4px 0; border-bottom: 1px solid var(--rule); }
.wxl .hours { display: grid; grid-template-columns: repeat(6, 1fr); text-align: center; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--rule); margin-bottom: 10px; }
.wxl .hours div { padding: 6px 0; font-size: 13px; line-height: 1.35; }
.wxl .hours .h { font-size: 11px; color: var(--muted); }
.wxl .hours .s { font-size: 19px; display: block; }
.wxl .hours .p { font-weight: 700; }
.wxl .hours .p.wet { color: var(--down); }
.wxl h5 { font-family: var(--display); font-size: 17px; margin: 10px 0 2px; }
.wxl table td { font-size: 14px; padding: 4px 3px; }
.wxl .wet { color: var(--down); font-weight: 700; }
figure.photo { display: none; }
figure.photo.ready { display: block; }
.photo .ph-img { display: block; width: 100%; height: auto; border-radius: 2px; background: var(--card); }
.photo .credit { display: block; font-size: 11.5px; font-style: italic; color: var(--muted); margin-top: 3px; }
.photo.portrait .ph-img { width: 46%; float: left; margin: 0 12px 6px 0; }
.photo.portrait::after { content: ""; display: block; clear: both; }
@media (prefers-reduced-motion: reduce) { #bar i { transition: none; } }
</style>

</head><body>
<div id="app">
<div id="bar" aria-hidden="true"><i></i></div>
<main id="reader" aria-label="The Paul Times, swipe left for the next page"></main>
</div>

<div id="src">
{{SECTIONS}}
</div>

<script>
const SUDOKU = {{SUDOKU_DATA}};
(function () {
  const app = document.getElementById('app');
  function fit() {
    // iOS Home Screen apps report a shrinking viewport on some launches; use the physical screen there.
    const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    if (!standalone) { app.style.height = ''; return; }
    const landscape = matchMedia('(orientation: landscape)').matches;
    const full = landscape ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height) === screen.width ? screen.height : screen.width;
    app.style.height = Math.max(full, window.innerHeight) + 'px';
  }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', () => setTimeout(fit, 300));
  addEventListener('pageshow', fit);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fit(); });
  const reader = document.getElementById('reader');
  const barFill = document.querySelector('#bar i');
  const src = [...document.querySelectorAll('#src > section')];
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const ISSUE = 'tpt-{{ISSUE_ID}}';
  let mode = 'scroll';
  const sstate = ls.get(ISSUE + '-sudoku', [{}, {}]);
  let pages = [];

  function buildToc() {
    const toc = document.getElementById('toc');
    toc.innerHTML = '';
    src.slice(1).forEach((s, i) => {
      const b = document.createElement('button');
      b.dataset.goto = s.dataset.key;
      b.style.setProperty('--accent', 'var(' + s.dataset.accent + ')');
      b.innerHTML = '<span>' + s.dataset.title + '</span><span>' + (i + 2) + '</span>';
      toc.appendChild(b);
    });
  }

  function newPage(sec) {
    const p = document.createElement('article');
    p.className = 'page';
    p.dataset.key = sec.dataset.key;
    p.style.setProperty('--accent', 'var(' + sec.dataset.accent + ')');
    p.innerHTML = '<header class="ph"><span class="mast-s">The Paul Times</span><span class="where"></span></header><div class="pb"></div><footer class="pf"><button class="prev" aria-label="Previous page">‹ Prev</button><span class="num"></span><button class="next" aria-label="Next page">Next ›</button></footer>';
    reader.appendChild(p);
    return p;
  }

  function renderSudoku(el) {
    const i = +el.dataset.sudoku, d = SUDOKU[i], st = sstate[i] || (sstate[i] = {});
    el.innerHTML = '<div class="kicker">Puzzle break</div><div class="tt">Sudoku No. ' + (i + 1) + ' · ' + d.label + '</div><div class="note">Tap a square, type 1 to 9.</div>';
    const g = document.createElement('div');
    g.className = 'grid';
    d.puzzle.forEach((row, r) => row.forEach((v, c) => {
      const k = r * 9 + c;
      if (v) { const s = document.createElement('div'); s.className = 'g'; s.textContent = v; g.appendChild(s); }
      else {
        const inp = document.createElement('input');
        inp.id = 'sdk' + i + '-' + k; inp.inputMode = 'numeric'; inp.maxLength = 1; inp.autocomplete = 'off';
        inp.setAttribute('aria-label', 'Row ' + (r + 1) + ' column ' + (c + 1));
        inp.dataset.s = i; inp.dataset.k = k;
        if (st[k]) inp.value = st[k];
        g.appendChild(inp);
      }
    }));
    el.appendChild(g);
    const btns = document.createElement('div');
    btns.className = 'btns';
    btns.innerHTML = '<button data-act="check" data-s="' + i + '">Check</button><button data-act="reveal" data-s="' + i + '">Reveal answer</button><button data-act="clear" data-s="' + i + '">Clear</button>';
    el.appendChild(btns);
    const m = document.createElement('div'); m.className = 'msg'; m.setAttribute('aria-live', 'polite'); el.appendChild(m);
  }

  function layout(keepKey) {
    reader.innerHTML = '';
    document.body.classList.toggle('mode-scroll', mode === 'scroll');
    src.forEach(sec => {
      let page = newPage(sec), body = page.querySelector('.pb');
      [...sec.children].forEach(blk => {
        const c = blk.cloneNode(true);
        if (c.dataset.sudoku !== undefined) renderSudoku(c);
        body.appendChild(c);
        if (mode === 'scroll') return;
        if (body.scrollHeight > body.clientHeight + 2 && body.children.length > 1) {
          body.removeChild(c);
          const carry = [];
          while (body.children.length > 1 && body.lastElementChild.classList.contains('kn')) carry.unshift(body.lastElementChild), body.removeChild(body.lastElementChild);
          page = newPage(sec); body = page.querySelector('.pb');
          carry.forEach(x => body.appendChild(x));
          body.appendChild(c);
        }
        if (body.scrollHeight > body.clientHeight + 2) body.classList.add('overflow');
      });
    });
    pages = [...reader.querySelectorAll('.page')];
    const counts = {};
    pages.forEach(p => counts[p.dataset.key] = (counts[p.dataset.key] || 0) + 1);
    const seen = {};
    pages.forEach((p, idx) => {
      const k = p.dataset.key; seen[k] = (seen[k] || 0) + 1;
      const title = src.find(s => s.dataset.key === k).dataset.title;
      p.querySelector('.where').textContent = counts[k] > 1 ? title + ' ' + seen[k] + '/' + counts[k] : title;
      p.querySelector('.num').textContent = (idx + 1) + ' / ' + pages.length;
      p.querySelector('.prev').disabled = idx === 0;
      p.querySelector('.next').disabled = idx === pages.length - 1;
    });
    document.getElementById('m-swipe')?.setAttribute('aria-pressed', mode === 'swipe');
    document.getElementById('m-scroll')?.setAttribute('aria-pressed', mode === 'scroll');
    pages.forEach(p => p.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode)));
    if (keepKey) goTo(keepKey, false);
    onScroll();
    loadPhotos(reader);
    loadWeather(reader);
  }


  // ---- Photos: resolved on the phone from Wikimedia Commons (free licences only) ----
  const PHOTO_CACHE = 'tpt-photo-';
  const strip = h => { const d = document.createElement('div'); d.innerHTML = h || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
  async function wjson(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
  async function commonsInfo(fileTitle) {
    const u = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url|extmetadata|mime&iiurlwidth=900&titles=' + encodeURIComponent(fileTitle);
    const d = await wjson(u);
    const p = Object.values(d.query.pages)[0];
    if (!p || p.missing !== undefined || !p.imageinfo) return null;
    const ii = p.imageinfo[0];
    if (!/^image\/(jpeg|png|webp)$/.test(ii.mime || '')) return null;
    if (!(ii.thumburl || '').includes('/wikipedia/commons/')) return null;
    const m = ii.extmetadata || {};
    const lic = strip(m.LicenseShortName && m.LicenseShortName.value);
    if (/fair use|non-free/i.test(lic)) return null;
    return { src: ii.thumburl, w: ii.thumbwidth, h: ii.thumbheight, artist: strip(m.Artist && m.Artist.value).slice(0, 60), lic: lic, page: ii.descriptionurl };
  }
  async function resolvePhoto(fig) {
    const key = fig.dataset.file || fig.dataset.wiki || fig.dataset.commons;
    try { const c = JSON.parse(localStorage.getItem(PHOTO_CACHE + key)); if (c) return c; } catch (e) {}
    let info = null;
    if (fig.dataset.file) info = await commonsInfo(fig.dataset.file);
    else if (fig.dataset.wiki) {
      const [lang, title] = fig.dataset.wiki.split('|');
      const d = await wjson('https://' + lang + '.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=name&redirects=1&titles=' + encodeURIComponent(title));
      const p = Object.values(d.query.pages)[0];
      if (p && p.pageimage) info = await commonsInfo('File:' + p.pageimage);
    } else if (fig.dataset.commons) {
      const d = await wjson('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&list=search&srnamespace=6&srlimit=6&srsearch=' + encodeURIComponent(fig.dataset.commons + ' filetype:bitmap'));
      for (const hit of (d.query && d.query.search) || []) { info = await commonsInfo(hit.title); if (info) break; }
    }
    if (info) { try { localStorage.setItem(PHOTO_CACHE + key, JSON.stringify(info)); } catch (e) {} }
    return info;
  }
  async function loadPhotos(root) {
    for (const fig of root.querySelectorAll('figure.photo:not(.done)')) {
      fig.classList.add('done');
      resolvePhoto(fig).then(info => {
        if (!info) return;
        const img = new Image();
        img.className = 'ph-img'; img.alt = fig.dataset.alt || ''; img.width = info.w; img.height = info.h; img.decoding = 'async';
        img.onerror = () => fig.classList.remove('ready');
        fig.classList.add('ready');
        img.src = info.src;
        fig.insertBefore(img, fig.firstChild);
        const cap = fig.querySelector('figcaption') || fig.appendChild(document.createElement('figcaption'));
        const cr = document.createElement('span'); cr.className = 'credit';
        cr.textContent = 'Photo: ' + (info.artist || 'Wikimedia Commons') + (info.lic ? ', ' + info.lic : '') + ', via Wikimedia Commons';
        cap.appendChild(cr);
      }).catch(() => {});
    }
  }
  // ---------- live weather (Open-Meteo, fetched on the phone when the issue opens) ----------
  const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=52.3676,45.8992&longitude=4.9041,6.1294'
    + '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m'
    + '&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_gusts_10m'
    + '&daily=weather_code,temperature_2m_min,temperature_2m_max,precipitation_probability_max,precipitation_sum,wind_gusts_10m_max,sunset'
    + '&timezone=Europe%2FAmsterdam&forecast_days=5&wind_speed_unit=kmh';
  let wxCache = null;
  function wxSym(c) {
    if (c === 0) return ['☀️', 'clear']; if (c <= 2) return ['🌤️', 'partly cloudy']; if (c === 3) return ['☁️', 'cloudy'];
    if (c === 45 || c === 48) return ['🌫️', 'fog']; if (c >= 51 && c <= 57) return ['🌦️', 'drizzle'];
    if (c >= 61 && c <= 67) return ['🌧️', 'rain']; if (c >= 71 && c <= 77) return ['❄️', 'snow'];
    if (c >= 80 && c <= 82) return ['🌦️', 'showers']; if (c === 85 || c === 86) return ['🌨️', 'snow showers'];
    if (c >= 95) return ['⛈️', 'thunderstorms']; return ['☁️', ''];
  }
  const hh = iso => iso.slice(11, 16);
  const dayName = iso => new Date(iso + 'T12:00').toLocaleDateString('en-GB', { weekday: 'short' });
  function wxCity(d) {
    // window: from the current hour to 23:00; after 21:00 switch to tomorrow 07:00 to 23:00
    const nowIso = d.current.time.slice(0, 13);
    const today = d.current.time.slice(0, 10);
    let dayIdx = 0, startH = Math.max(7, +nowIso.slice(11, 13));
    if (+nowIso.slice(11, 13) >= 21) { dayIdx = 1; startH = 7; }
    const day = d.daily.time[dayIdx];
    const H = d.hourly, idx = [];
    H.time.forEach((t, i) => { if (t.slice(0, 10) === day && +t.slice(11, 13) >= startH && +t.slice(11, 13) <= 23) idx.push(i); });
    return { d, day, dayIdx, idx, tomorrow: dayIdx === 1, today };
  }
  function wxVerdict(c) {
    const H = c.d.hourly, I = c.idx;
    const wet = I.filter(i => H.precipitation_probability[i] >= 50 && H.precipitation[i] >= 0.2);
    const mm = I.reduce((a, i) => a + H.precipitation[i], 0);
    const maxP = Math.max(0, ...I.map(i => H.precipitation_probability[i]));
    const peak = I.reduce((b, i) => H.precipitation_probability[i] > H.precipitation_probability[b] ? i : b, I[0]);
    const when = c.tomorrow ? 'tomorrow' : 'today';
    if (wet.length || mm >= 1) {
      const from = hh(H.time[(wet[0] ?? peak)]), to = hh(H.time[(wet[wet.length - 1] ?? peak)]);
      return { cls: 'yes', v: '☂ Rain gear: YES', why: `Rain likely ${when} ${from === to ? 'around ' + from : 'from ' + from + ' to ' + (+to.slice(0, 2) + 1).toString().padStart(2, '0') + ':00'}, about ${mm.toFixed(1)} mm in total (peak ${maxP}%).` };
    }
    if (maxP >= 30 || mm >= 0.2) return { cls: 'maybe', v: '☂ Pack it, just in case', why: `Mostly dry ${when}, but a shower is possible around ${hh(H.time[peak])} (${maxP}%).` };
    return { cls: 'no', v: 'No rain gear needed', why: `Dry ${when}: rain chance never above ${maxP}%.` };
  }
  function wxWear(c) {
    const H = c.d.hourly; const lo = Math.min(...c.idx.map(i => H.apparent_temperature[i]));
    if (lo <= 3) return 'Thermal layer, warm jacket and gloves';
    if (lo <= 9) return 'Warm jacket, gloves on the scooter';
    if (lo <= 15) return 'Jacket';
    if (lo <= 21) return 'Light jacket or hoodie';
    return 'T-shirt weather';
  }
  function wxRender(el, all) {
    const ams = wxCity(all[0]), ann = wxCity(all[1]);
    const A = all[0], H = A.hourly, D = A.daily, v = wxVerdict(ams);
    const gust = Math.max(...ams.idx.map(i => H.wind_gusts_10m[i]));
    const lo = Math.min(...ams.idx.map(i => H.apparent_temperature[i])), hi = Math.max(...ams.idx.map(i => H.temperature_2m[i]));
    const windTxt = gust >= 60 ? `<b>Strong gusts up to ${Math.round(gust)} km/h.</b> Slow down on bridges and open roads.` : gust >= 40 ? `Gusty, up to ${Math.round(gust)} km/h. Hold the bars on bridges.` : `Light wind, gusts up to ${Math.round(gust)} km/h.`;
    const step = Math.max(1, Math.ceil(ams.idx.length / 6));
    const cells = ams.idx.filter((_, k) => k % step === 0).slice(0, 6).map(i => {
      const p = H.precipitation_probability[i];
      return `<div><span class="h">${hh(H.time[i])}</span><span class="s">${wxSym(H.weather_code[i])[0]}</span>${Math.round(H.temperature_2m[i])}°<br><span class="p${p >= 50 ? ' wet' : ''}">${p}%</span></div>`;
    }).join('');
    const days = (X, from) => [1, 2, 3].map(k => k + from).filter(k => k < X.daily.time.length).map(k => {
      const p = X.daily.precipitation_probability_max[k], mm = X.daily.precipitation_sum[k];
      return `<tr><td>${dayName(X.daily.time[k])}</td><td>${wxSym(X.daily.weather_code[k])[0]}</td><td>${Math.round(X.daily.temperature_2m_min[k])}°/${Math.round(X.daily.temperature_2m_max[k])}°</td><td class="r${p >= 50 ? ' wet' : ''}">${p}%</td><td class="r">${mm.toFixed(1)} mm</td><td class="r">${Math.round(X.daily.wind_gusts_10m_max[k])} km/h</td></tr>`;
    }).join('');
    const nowS = wxSym(A.current.weather_code);
    const B = all[1], bS = wxSym(B.current.weather_code), bi = ann.dayIdx;
    const upd = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    el.innerHTML = `<div class="live"><span>Weather · live</span><span>updated ${upd}</span></div>
      <h5 style="margin-top:0">Amsterdam ${ams.tomorrow ? '· tomorrow' : '· today'}</h5>
      <div class="verdict ${v.cls}"><div class="v">${v.v}</div><div class="why">${v.why}</div></div>
      <div class="now"><span class="t">${Math.round(A.current.temperature_2m)}°C</span><span class="d">now, ${nowS[1]}, feels ${Math.round(A.current.apparent_temperature)}°</span></div>
      <ul class="facts">
        <li><b>Range:</b> feels ${Math.round(lo)}° at worst, up to ${Math.round(hi)}°</li>
        <li><b>Wear:</b> ${wxWear(ams)}</li>
        <li><b>Wind:</b> ${windTxt}</li>
        <li><b>Dark from:</b> ${hh(D.sunset[ams.dayIdx])}</li>
      </ul>
      <div class="hours">${cells}</div>
      <div class="tbl"><table>${days(A, ams.dayIdx)}</table></div>
      <h5>Annecy</h5>
      <p class="small" style="margin:0 0 4px">${bS[0]} ${Math.round(B.current.temperature_2m)}°C now, ${bS[1]}. ${ann.tomorrow ? 'Tomorrow' : 'Today'} ${Math.round(B.daily.temperature_2m_min[bi])}° to ${Math.round(B.daily.temperature_2m_max[bi])}°, rain ${B.daily.precipitation_probability_max[bi]}%.</p>
      <div class="tbl"><table>${days(B, bi)}</table></div>
      <p class="note" style="margin-top:6px">Live forecast from Open-Meteo, refreshed every time you open the issue.</p>`;
  }
  async function loadWeather(root) {
    const els = root.querySelectorAll('[data-wx]:not(.done)');
    if (!els.length) return;
    els.forEach(e => e.classList.add('done'));
    try {
      if (!wxCache || Date.now() - wxCache.t > 600000) {
        const r = await fetch(WX_URL); if (!r.ok) throw 0;
        wxCache = { t: Date.now(), d: await r.json() };
      }
      els.forEach(e => wxRender(e, wxCache.d));
    } catch (e) { /* keep the printed forecast */ }
  }
  function current() { return Math.round(reader.scrollLeft / Math.max(1, reader.clientWidth)); }
  function goIdx(i, smooth) { reader.scrollTo({ left: i * reader.clientWidth, behavior: smooth === false ? 'auto' : 'smooth' }); }
  function goTo(key, smooth) { const i = pages.findIndex(p => p.dataset.key === key); if (i >= 0) goIdx(i, smooth); }

  function onScroll() {
    const i = current(), p = pages[i];
    if (!p) return;
    barFill.style.width = ((i + 1) / pages.length * 100) + '%';
    document.documentElement.style.setProperty('--accent', getComputedStyle(p).getPropertyValue('--accent'));
    barFill.style.background = 'var(' + src.find(s => s.dataset.key === p.dataset.key).dataset.accent + ')';
  }

  reader.addEventListener('scroll', () => requestAnimationFrame(onScroll), { passive: true });
  reader.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.classList.contains('prev')) goIdx(current() - 1);
    else if (t.classList.contains('next')) goIdx(current() + 1);
    else if (t.dataset.goto) goTo(t.dataset.goto);
    else if (t.dataset.mode) { if (mode !== t.dataset.mode) { mode = t.dataset.mode; ls.set('tpt-mode', mode); layout('front'); } }
    else if (t.dataset.act) sudokuAction(t);
  });
  reader.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.s === undefined) return;
    t.value = t.value.replace(/[^1-9]/g, '').slice(-1);
    t.classList.remove('bad');
    sstate[t.dataset.s][t.dataset.k] = t.value;
    ls.set(ISSUE + '-sudoku', sstate);
  });
  function sudokuAction(b) {
    const i = +b.dataset.s, d = SUDOKU[i], box = b.closest('.sdk'), msg = box.querySelector('.msg');
    const inputs = [...box.querySelectorAll('input')];
    if (b.dataset.act === 'check') {
      let wrong = 0, empty = 0;
      inputs.forEach(inp => { const k = +inp.dataset.k, v = +inp.value; if (!v) empty++; else if (v !== d.solution[Math.floor(k / 9)][k % 9]) { wrong++; inp.classList.add('bad'); } });
      msg.textContent = wrong ? wrong + ' wrong, marked in red.' : empty ? 'All correct so far. ' + empty + ' squares to go.' : 'Solved. Well done.';
    } else if (b.dataset.act === 'reveal') {
      inputs.forEach(inp => { const k = +inp.dataset.k; inp.value = d.solution[Math.floor(k / 9)][k % 9]; inp.classList.remove('bad'); sstate[i][k] = inp.value; });
      ls.set(ISSUE + '-sudoku', sstate); msg.textContent = 'Answer revealed.';
    } else {
      inputs.forEach(inp => { inp.value = ''; inp.classList.remove('bad'); });
      sstate[i] = {}; ls.set(ISSUE + '-sudoku', sstate); msg.textContent = 'Cleared.';
    }
  }
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') goIdx(current() + 1);
    if (e.key === 'ArrowLeft') goIdx(current() - 1);
  });
  let rt, lastW = innerWidth, lastH = innerHeight;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (Math.abs(innerWidth - lastW) < 2 && Math.abs(innerHeight - lastH) < 80) return;
      lastW = innerWidth; lastH = innerHeight;
      const k = pages[current()] ? pages[current()].dataset.key : 'front';
      layout(k);
    }, 200);
  });

  buildToc();
  const start = () => layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
  start();
})();
</script>
</body></html>
