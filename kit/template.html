<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paul Times">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="manifest" href="manifest.webmanifest">
<title>The Paul Times · {{ISSUE_LABEL}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

</head><body>
<div id="app">
<main id="reader" aria-label="The Paul Times, swipe left for the next page"></main>
<div id="bar" aria-hidden="true"><i></i></div>
<footer class="pf" id="pf"><button class="lib" aria-label="All issues"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M8 9h8M8 12.5h8M8 16h5"/></svg></button><span class="sepv"></span><button class="prev" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><span class="mid"><span class="num"></span></span><button class="next" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button><span class="sepv"></span><button class="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></button></footer>
<div id="settings" hidden><div class="sheet" role="dialog" aria-label="Settings">
  <div class="sh-head"><h3>Settings</h3><button class="sh-close" aria-label="Close settings">Done</button></div>
  <div class="sh-group">
  <div class="sh-row"><span>Language</span><div class="seg" data-set="lang"><button data-v="en">English</button><button data-v="fr">Français</button></div></div>
  <div class="sh-row"><span>Text size</span><div class="seg" data-set="text"><button data-v="s">Small</button><button data-v="m">Medium</button><button data-v="l">Large</button></div></div>
  <div class="sh-row"><span>Theme</span><div class="seg" data-set="theme"><button data-v="auto">Phone</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
  <div class="sh-row"><span>Scrub speed</span><div class="seg" data-set="scrub"><button data-v="1">Slow</button><button data-v="1.6">Normal</button><button data-v="2.5">Fast</button></div></div>
  </div>
  <p class="note sh-info"></p>
  <a class="sh-link" href="./?archive"><span>All issues</span><span>›</span></a>
</div></div>
</div>

<div id="src">
{{SECTIONS}}
</div>

<script type="application/json" id="screen-state">{{SCREEN_STATE}}</script>
<script>
const SUDOKU = {{SUDOKU_DATA}};
const FR = (() => { try { return (JSON.parse(localStorage.getItem('tpt-settings')) || {}).lang === 'fr'; } catch (e) { return false; } })();
const L = (en, fr) => FR ? fr : en;
document.documentElement.lang = FR ? 'fr' : 'en';
(function () {
  const app = document.getElementById('app');
  function typing() { const e = document.activeElement; return !!e && (e.tagName === 'INPUT' || e.tagName === 'TEXTAREA'); }
  function fit() {
    // Size the app to what is actually visible. iOS Home Screen apps sometimes report a viewport far
    // too short at launch (the old bottom gap); only then fall back to the physical screen height.
    const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    if (!standalone) { app.style.height = ''; return; }
    const landscape = matchMedia('(orientation: landscape)').matches;
    const full = landscape ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
    const vis = Math.round(Math.max(window.innerHeight, window.visualViewport ? visualViewport.height : 0));
    app.style.height = (vis < full * 0.85 ? full : vis) + 'px';
    // iOS 26 Home Screen apps: the drawable area stops one status bar short of the screen bottom (793 of 852 pt),
    // and the home indicator lies outside it. Then sit the toolbar just above the visible bottom edge.
    document.documentElement.style.setProperty('--pf-b', vis < full - 20 ? '10px' : '');
    // WebKit bug 301994: the web layer stops short of the screen bottom, so the home-indicator padding is already outside it.
    app.style.paddingBottom = vis < full - 20 ? '0px' : '';
    if (window.scrollY && !typing()) window.scrollTo(0, 0);
  }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', () => setTimeout(fit, 300));
  addEventListener('pageshow', fit);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fit(); });
  // iOS ignores user-scalable=no for pinch; block pinch and double-tap zoom gestures explicitly.
  ['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouchEnd < 300 && !e.target.closest('input, button, a')) e.preventDefault(); lastTouchEnd = now; }, { passive: false });
  // iOS scrolls the whole page up to show the keyboard and does not always scroll it back; the drawing
  // then sits above the tap targets. Snap the page back whenever no text field is being edited.
  const resetScroll = () => { if (!typing() && (window.scrollY || window.scrollX || document.documentElement.scrollTop)) { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } };
  document.addEventListener('focusout', () => { setTimeout(resetScroll, 60); setTimeout(resetScroll, 400); });
  if (window.visualViewport) { visualViewport.addEventListener('resize', () => setTimeout(() => { if (!typing()) fit(); resetScroll(); }, 60)); visualViewport.addEventListener('scroll', () => setTimeout(resetScroll, 60)); }

  const reader = document.getElementById('reader');
  const barFill = document.querySelector('#bar i');
  const pf = document.getElementById('pf'), pfNum = pf.querySelector('.num'), pfPrev = pf.querySelector('.prev'), pfNext = pf.querySelector('.next');
  const src = [...document.querySelectorAll('#src > section')];
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const ISSUE = 'tpt-{{ISSUE_ID}}';
  let mode = 'scroll';
  const sstate = ls.get(ISSUE + '-sudoku', [{}, {}]);
  let pages = [];

  function buildToc() {
    const toc = document.getElementById('toc');
    toc.innerHTML = '';
    src.slice(1).forEach((s, i) => {
      const b = document.createElement('button');
      b.dataset.goto = s.dataset.key;
      b.style.setProperty('--accent', 'var(' + s.dataset.accent + ')');
      b.innerHTML = '<span class="ic">' + (i + 2) + '</span><span class="tt">' + s.dataset.title + '</span><span class="ch">›</span>';
      toc.appendChild(b);
    });
  }

  function newPage(sec) {
    const p = document.createElement('article');
    p.className = 'page';
    p.dataset.key = sec.dataset.key;
    p.style.setProperty('--accent', 'var(' + sec.dataset.accent + ')');
    p.innerHTML = '<header class="ph"><span class="mast-s">The Paul Times</span><span class="where"></span></header><div class="pb"></div>';
    reader.appendChild(p);
    return p;
  }

  function renderSudoku(el) {
    const i = +el.dataset.sudoku, d = SUDOKU[i], st = sstate[i] || (sstate[i] = {});
    el.innerHTML = '<div class="kicker">' + L('Puzzle break', 'La pause') + '</div><div class="tt">Sudoku No. ' + (i + 1) + ' · ' + d.label + '</div><div class="note">' + L('Tap a square, then a number. Notes: switch on ✎ and tap several numbers.', 'Touche une case, puis un chiffre. Notes : active ✎ et touche plusieurs chiffres.') + '</div>';
    const g = document.createElement('div');
    g.className = 'grid';
    d.puzzle.forEach((row, r) => row.forEach((v, c) => {
      const k = r * 9 + c;
      if (v) { const s = document.createElement('div'); s.className = 'g'; s.textContent = v; s.dataset.k = k; s.dataset.v = v; g.appendChild(s); }
      else { const b = document.createElement('button'); b.className = 'c'; b.dataset.k = k; b.setAttribute('aria-label', 'Row ' + (r + 1) + ' column ' + (c + 1)); g.appendChild(b); }
    }));
    el.appendChild(g);
    const pad = document.createElement('div'); pad.className = 'pad';
    pad.innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => '<button data-n="' + n + '">' + n + '</button>').join('');
    el.appendChild(pad);
    const pad2 = document.createElement('div'); pad2.className = 'pad2';
    pad2.innerHTML = '<button data-notes aria-pressed="false">✎ ' + L('Notes', 'Notes') + '</button><button data-erase>⌫ ' + L('Erase', 'Effacer') + '</button>';
    el.appendChild(pad2);
    sdkPaint(el);
    setTimeout(() => { if (!el.querySelector('.tally')) { const tl = document.createElement('p'); tl.className = 'note tally'; tl.style.marginTop = '6px'; tl.textContent = sdkTally(); el.appendChild(tl); } }, 0);
    g.addEventListener('click', e => { const c = e.target.closest('.c, .g'); if (!c) return; el._sel = +c.dataset.k; sdkPaint(el); });
    pad.addEventListener('click', e => { const b = e.target.closest('button'); if (b) sdkInput(el, +b.dataset.n); });
    pad2.querySelector('[data-notes]').onclick = () => { el._notes = !el._notes; sdkPaint(el); };
    pad2.querySelector('[data-erase]').onclick = () => sdkInput(el, 0);
    const btns = document.createElement('div');
    btns.className = 'btns';
    btns.innerHTML = '<button data-act="check" data-s="' + i + '">' + L('Check', 'Vérifier') + '</button><button data-act="reveal" data-s="' + i + '">' + L('Reveal answer', 'Solution') + '</button><button data-act="clear" data-s="' + i + '">' + L('Clear', 'Effacer') + '</button>';
    el.appendChild(btns);
    const m = document.createElement('div'); m.className = 'msg'; m.setAttribute('aria-live', 'polite'); el.appendChild(m);
  }

  function layout(keepKey) {
    reader.innerHTML = '';
    document.body.classList.toggle('mode-scroll', mode === 'scroll');
    src.forEach(sec => {
      let page = newPage(sec), body = page.querySelector('.pb');
      [...sec.children].forEach(blk => {
        const c = blk.cloneNode(true);
        if (c.dataset.sudoku !== undefined) renderSudoku(c);
        body.appendChild(c);
        if (mode === 'scroll') return;
        if (body.scrollHeight > body.clientHeight + 2 && body.children.length > 1) {
          body.removeChild(c);
          const carry = [];
          while (body.children.length > 1 && body.lastElementChild.classList.contains('kn')) carry.unshift(body.lastElementChild), body.removeChild(body.lastElementChild);
          page = newPage(sec); body = page.querySelector('.pb');
          carry.forEach(x => body.appendChild(x));
          body.appendChild(c);
        }
        if (body.scrollHeight > body.clientHeight + 2) body.classList.add('overflow');
      });
    });
    pages = [...reader.querySelectorAll('.page')];
    const counts = {};
    pages.forEach(p => counts[p.dataset.key] = (counts[p.dataset.key] || 0) + 1);
    const seen = {};
    pages.forEach((p, idx) => {
      const k = p.dataset.key; seen[k] = (seen[k] || 0) + 1;
      const title = src.find(s => s.dataset.key === k).dataset.title;
      p.querySelector('.where').textContent = counts[k] > 1 ? title + ' ' + seen[k] + '/' + counts[k] : title;
    });
    document.getElementById('m-swipe')?.setAttribute('aria-pressed', mode === 'swipe');
    document.getElementById('m-scroll')?.setAttribute('aria-pressed', mode === 'scroll');
    pages.forEach(p => p.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode)));
    if (keepKey) goTo(keepKey, false);
    onScroll();
    loadPhotos(reader);
    loadWeather(reader);
    loadScreen(reader);
    loadPosters(reader);
  }


  // ---- Photos: resolved on the phone from Wikimedia Commons (free licences only) ----
  const PHOTO_CACHE = 'tpt-photo-';
  const strip = h => { const d = document.createElement('div'); d.innerHTML = h || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
  async function wjson(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
  async function commonsInfo(fileTitle) {
    const u = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url|extmetadata|mime&iiurlwidth=900&titles=' + encodeURIComponent(fileTitle);
    const d = await wjson(u);
    const p = Object.values(d.query.pages)[0];
    if (!p || p.missing !== undefined || !p.imageinfo) return null;
    const ii = p.imageinfo[0];
    if (!/^image\/(jpeg|png|webp|svg\+xml|gif)$/.test(ii.mime || '')) return null;
    if (!(ii.thumburl || '').includes('/wikipedia/commons/')) return null;
    const m = ii.extmetadata || {};
    const lic = strip(m.LicenseShortName && m.LicenseShortName.value);
    if (/fair use|non-free/i.test(lic)) return null;
    return { src: ii.thumburl, w: ii.thumbwidth, h: ii.thumbheight, artist: strip(m.Artist && m.Artist.value).slice(0, 60), lic: lic, page: ii.descriptionurl };
  }
  async function resolvePhoto(fig) {
    if (fig.dataset.src) return { src: fig.dataset.src, direct: true, artist: fig.dataset.credit || '', page: fig.dataset.link || '' };
    const key = fig.dataset.file || fig.dataset.wiki || fig.dataset.commons;
    try { const c = JSON.parse(localStorage.getItem(PHOTO_CACHE + key)); if (c) return c; } catch (e) {}
    let info = null;
    if (fig.dataset.file) info = await commonsInfo(fig.dataset.file);
    else if (fig.dataset.wiki) {
      const [lang, title] = fig.dataset.wiki.split('|');
      const d = await wjson('https://' + lang + '.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=name&redirects=1&titles=' + encodeURIComponent(title));
      const p = Object.values(d.query.pages)[0];
      if (p && p.pageimage) info = await commonsInfo('File:' + p.pageimage);
    } else if (fig.dataset.commons) {
      const d = await wjson('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&list=search&srnamespace=6&srlimit=6&srsearch=' + encodeURIComponent(fig.dataset.commons + ' filetype:bitmap'));
      for (const hit of (d.query && d.query.search) || []) { info = await commonsInfo(hit.title); if (info) break; }
    }
    if (info) { try { localStorage.setItem(PHOTO_CACHE + key, JSON.stringify(info)); } catch (e) {} }
    return info;
  }
  async function loadPhotos(root) {
    for (const fig of root.querySelectorAll('figure.photo:not(.done)')) {
      fig.classList.add('done');
      resolvePhoto(fig).then(info => {
        if (!info) return;
        const img = new Image();
        img.className = 'ph-img'; img.alt = fig.dataset.alt || ''; if (info.w) { img.width = info.w; img.height = info.h; } img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        img.onload = () => fig.classList.add('ready');
        img.onerror = () => fig.classList.remove('ready');
        if (!info.direct) fig.classList.add('ready');
        img.src = info.src;
        fig.insertBefore(img, fig.firstChild);
        const cap = fig.querySelector('figcaption') || fig.appendChild(document.createElement('figcaption'));
        const cr = document.createElement('span'); cr.className = 'credit';
        if (info.direct) {
          cr.textContent = 'Image: ' + (info.artist || 'source');
          if (info.page) { const l = document.createElement('a'); l.href = info.page; l.target = '_blank'; l.rel = 'noopener'; l.textContent = ' · open source ›'; cr.appendChild(l); }
        } else cr.textContent = 'Photo: ' + (info.artist || 'Wikimedia Commons') + (info.lic ? ', ' + info.lic : '') + ', via Wikimedia Commons';
        cap.appendChild(cr);
      }).catch(() => {});
    }
  }
  // ---------- live weather (Open-Meteo, fetched on the phone when the issue opens) ----------
  const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=52.3676,45.8992&longitude=4.9041,6.1294'
    + '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m'
    + '&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_gusts_10m'
    + '&daily=weather_code,temperature_2m_min,temperature_2m_max,precipitation_probability_max,precipitation_sum,wind_gusts_10m_max,sunset'
    + '&timezone=Europe%2FAmsterdam&forecast_days=5&wind_speed_unit=kmh';
  let wxCache = null;
  function wxSym(c) {
    if (c === 0) return ['☀️', 'clear']; if (c <= 2) return ['🌤️', 'partly cloudy']; if (c === 3) return ['☁️', 'cloudy'];
    if (c === 45 || c === 48) return ['🌫️', 'fog']; if (c >= 51 && c <= 57) return ['🌦️', 'drizzle'];
    if (c >= 61 && c <= 67) return ['🌧️', 'rain']; if (c >= 71 && c <= 77) return ['❄️', 'snow'];
    if (c >= 80 && c <= 82) return ['🌦️', 'showers']; if (c === 85 || c === 86) return ['🌨️', 'snow showers'];
    if (c >= 95) return ['⛈️', 'thunderstorms']; return ['☁️', ''];
  }
  const hh = iso => iso.slice(11, 16);
  const dayName = iso => new Date(iso + 'T12:00').toLocaleDateString(FR ? 'fr-FR' : 'en-GB', { weekday: 'short' });
  function wxCity(d) {
    // window: from the current hour to 23:00; after 21:00 switch to tomorrow 07:00 to 23:00
    const nowIso = d.current.time.slice(0, 13);
    const today = d.current.time.slice(0, 10);
    let dayIdx = 0, startH = Math.max(7, +nowIso.slice(11, 13));
    if (+nowIso.slice(11, 13) >= 21) { dayIdx = 1; startH = 7; }
    const day = d.daily.time[dayIdx];
    const H = d.hourly, idx = [];
    H.time.forEach((t, i) => { if (t.slice(0, 10) === day && +t.slice(11, 13) >= startH && +t.slice(11, 13) <= 23) idx.push(i); });
    return { d, day, dayIdx, idx, tomorrow: dayIdx === 1, today };
  }
  function wxVerdict(c) {
    const H = c.d.hourly, I = c.idx;
    const wet = I.filter(i => H.precipitation_probability[i] >= 50 && H.precipitation[i] >= 0.2);
    const mm = I.reduce((a, i) => a + H.precipitation[i], 0);
    const maxP = Math.max(0, ...I.map(i => H.precipitation_probability[i]));
    const peak = I.reduce((b, i) => H.precipitation_probability[i] > H.precipitation_probability[b] ? i : b, I[0]);
    const when = c.tomorrow ? L('tomorrow', 'demain') : L('today', 'aujourd\'hui');
    if (wet.length || mm >= 1) {
      const from = hh(H.time[(wet[0] ?? peak)]), to = hh(H.time[(wet[wet.length - 1] ?? peak)]);
      const till = (+to.slice(0, 2) + 1).toString().padStart(2, '0') + ':00';
      return { cls: 'yes', v: L('☂ Rain gear: YES', '☂ Tenue de pluie : OUI'), why: L(`Rain likely ${when} ${from === to ? 'around ' + from : 'from ' + from + ' to ' + till}, about ${mm.toFixed(1)} mm in total (peak ${maxP}%).`, `Pluie probable ${when} ${from === to ? 'vers ' + from : 'de ' + from + ' à ' + till}, environ ${mm.toFixed(1)} mm au total (pic ${maxP} %).`) };
    }
    if (maxP >= 30 || mm >= 0.2) return { cls: 'maybe', v: L('☂ Pack it, just in case', '☂ Prends-la, au cas où'), why: L(`Mostly dry ${when}, but a shower is possible around ${hh(H.time[peak])} (${maxP}%).`, `Plutôt sec ${when}, mais une averse est possible vers ${hh(H.time[peak])} (${maxP} %).`) };
    return { cls: 'no', v: L('No rain gear needed', 'Pas besoin de tenue de pluie'), why: L(`Dry ${when}: rain chance never above ${maxP}%.`, `Sec ${when} : risque de pluie jamais au-dessus de ${maxP} %.`) };
  }
  function wxWear(c) {
    const H = c.d.hourly; const lo = Math.min(...c.idx.map(i => H.apparent_temperature[i]));
    if (lo <= 3) return L('Thermal layer, warm jacket and gloves', 'Sous-couche thermique, veste chaude et gants');
    if (lo <= 9) return L('Warm jacket, gloves on the scooter', 'Veste chaude, gants sur le scooter');
    if (lo <= 15) return L('Jacket', 'Veste');
    if (lo <= 21) return L('Light jacket or hoodie', 'Veste légère ou sweat');
    return L('T-shirt weather', 'Temps à t-shirt');
  }
  function wxRender(el, all) {
    const ams = wxCity(all[0]), ann = wxCity(all[1]);
    const A = all[0], H = A.hourly, D = A.daily, v = wxVerdict(ams);
    const gust = Math.max(...ams.idx.map(i => H.wind_gusts_10m[i]));
    const lo = Math.min(...ams.idx.map(i => H.apparent_temperature[i])), hi = Math.max(...ams.idx.map(i => H.temperature_2m[i]));
    const G = Math.round(gust);
    const windTxt = gust >= 60 ? L(`<b>Strong gusts up to ${G} km/h.</b> Slow down on bridges and open roads.`, `<b>Fortes rafales jusqu'à ${G} km/h.</b> Ralentis sur les ponts et les routes dégagées.`) : gust >= 40 ? L(`Gusty, up to ${G} km/h. Hold the bars on bridges.`, `Venteux, jusqu'à ${G} km/h. Tiens bien le guidon sur les ponts.`) : L(`Light wind, gusts up to ${G} km/h.`, `Vent faible, rafales jusqu'à ${G} km/h.`);
    const step = Math.max(1, Math.ceil(ams.idx.length / 6));
    const cells = ams.idx.filter((_, k) => k % step === 0).slice(0, 6).map(i => {
      const p = H.precipitation_probability[i];
      return `<div><span class="h">${hh(H.time[i])}</span><span class="s">${wxSym(H.weather_code[i])[0]}</span>${Math.round(H.temperature_2m[i])}°<br><span class="p${p >= 50 ? ' wet' : ''}">${p}%</span></div>`;
    }).join('');
    const days = (X, from) => [1, 2, 3].map(k => k + from).filter(k => k < X.daily.time.length).map(k => {
      const p = X.daily.precipitation_probability_max[k], mm = X.daily.precipitation_sum[k];
      return `<tr><td>${dayName(X.daily.time[k])}</td><td>${wxSym(X.daily.weather_code[k])[0]}</td><td>${Math.round(X.daily.temperature_2m_min[k])}°/${Math.round(X.daily.temperature_2m_max[k])}°</td><td class="r${p >= 50 ? ' wet' : ''}">${p}%</td><td class="r">${mm.toFixed(1)} mm</td><td class="r">${Math.round(X.daily.wind_gusts_10m_max[k])} km/h</td></tr>`;
    }).join('');
    const nowS = wxSym(A.current.weather_code);
    const B = all[1], bS = wxSym(B.current.weather_code), bi = ann.dayIdx;

    if (t.classList.contains('prev')) goIdx(current() - 1);
    else if (t.classList.contains('next')) goIdx(current() + 1);
    else if (t.dataset.goto) goTo(t.dataset.goto);
    else if (t.dataset.mode) { if (mode !== t.dataset.mode) { mode = t.dataset.mode; ls.set('tpt-mode', mode); layout('front'); } }
    else if (t.dataset.act) sudokuAction(t);
  });
  const sdkVal = (st, k) => +(st[k] || 0);
  function sdkPaint(el) {
    const i = +el.dataset.sudoku, d = SUDOKU[i], st = sstate[i] || (sstate[i] = {});
    const sel = el._sel, sr = sel >= 0 ? Math.floor(sel / 9) : -1, sc = sel >= 0 ? sel % 9 : -1;
    const selV = sel >= 0 ? (d.puzzle[sr][sc] || sdkVal(st, sel)) : 0;
    el.classList.toggle('notes', !!el._notes);
    el.querySelector('[data-notes]').setAttribute('aria-pressed', String(!!el._notes));
    el.querySelectorAll('.grid > *').forEach(c => {
      const k = +c.dataset.k, r = Math.floor(k / 9), col = k % 9;
      const v = c.classList.contains('g') ? +c.dataset.v : sdkVal(st, k);
      const peer = sel >= 0 && (r === sr || col === sc || (Math.floor(r / 3) === Math.floor(sr / 3) && Math.floor(col / 3) === Math.floor(sc / 3)));
      c.classList.toggle('peer', peer && k !== sel);
      c.classList.toggle('same', !!selV && v === selV && k !== sel);
      c.classList.toggle('sel', k === sel && c.classList.contains('c'));
      if (c.classList.contains('c')) {
        if (v) c.textContent = v;
        else { const n = st['n' + k] || ''; c.innerHTML = n ? '<span class="nt">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(x => '<i>' + (n.includes(x) ? x : '') + '</i>').join('') + '</span>' : ''; }
      }
    });
  }
  function sdkInput(el, n) {
    const i = +el.dataset.sudoku, d = SUDOKU[i], st = sstate[i] || (sstate[i] = {}), k = el._sel;
    if (!(k >= 0) || d.puzzle[Math.floor(k / 9)][k % 9]) return;
    const cell = el.querySelector('.c[data-k="' + k + '"]'); if (cell) cell.classList.remove('bad');
    if (!n) { delete st[k]; delete st['n' + k]; }
    else if (el._notes) {
      if (st[k]) return;
      let nt = st['n' + k] || ''; nt = nt.includes(n) ? nt.replace(String(n), '') : (nt + n).split('').sort().join('');
      if (nt) st['n' + k] = nt; else delete st['n' + k];
    } else {
      if (sdkVal(st, k) === n) delete st[k]; else { st[k] = String(n); delete st['n' + k];
        // a placed number clears the same note from its row, column and box
        const r = Math.floor(k / 9), c = k % 9;
        for (let j = 0; j < 81; j++) { const jr = Math.floor(j / 9), jc = j % 9;
          if ((jr === r || jc === c || (Math.floor(jr / 3) === Math.floor(r / 3) && Math.floor(jc / 3) === Math.floor(c / 3))) && st['n' + j]) {
            st['n' + j] = st['n' + j].replace(String(n), ''); if (!st['n' + j]) delete st['n' + j]; } } }
    }
    ls.set(ISSUE + '-sudoku', sstate); sdkPaint(el); sdkCheckDone(el);
  }
  // ---- solved-puzzle record (kept on the phone, synced through the taps form, restored from each issue)
  const SDK_DONE = 'tpt-sdk-done', SDK_REV = 'tpt-sdk-revealed';
  const jget = k => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } };
  const jset = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  function sdkTally() {
    const done = jget(SDK_DONE), n = {};
    Object.values(done).forEach(x => { n[x.label] = (n[x.label] || 0) + 1; });
    const order = ['Easy', 'Medium', 'Hard'], fr = { Easy: 'Facile', Medium: 'Moyen', Hard: 'Difficile' };
    const parts = order.filter(l => n[l]).map(l => L(l, fr[l]) + ' ' + n[l]);
    return parts.length ? L('Solved so far: ', 'Résolus : ') + parts.join(' · ') : L('No sudoku solved yet.', 'Aucun sudoku résolu pour l\'instant.');
  }
  function sdkCheckDone(el) {
    const i = +el.dataset.sudoku, d = SUDOKU[i], st = sstate[i] || {};
    for (let k = 0; k < 81; k++) { const r = Math.floor(k / 9), c = k % 9; if (!d.puzzle[r][c] && sdkVal(st, k) !== d.solution[r][c]) return; }
    const id = '{{ISSUE_ID}}#' + i, done = jget(SDK_DONE), msg = el.querySelector('.msg');
    if (jget(SDK_REV)[id]) { if (msg) msg.textContent = L('Complete, but the answer was revealed, so it does not count.', 'Complet, mais la solution a été affichée : ça ne compte pas.'); return; }
    if (!done[id]) {
      done[id] = { label: d.label, t: Date.now() }; jset(SDK_DONE, done);
      sendEvent({ a: 'sudoku', t: Date.now(), title: id, kind: d.label });
    }
    if (msg) msg.textContent = L('Solved. Well done. ', 'Résolu. Bravo. ') + sdkTally();
    document.querySelectorAll('.sdk .tally').forEach(x => { x.textContent = sdkTally(); });
  }
  function sudokuAction(b) {
    const i = +b.dataset.s, d = SUDOKU[i], box = b.closest('.sdk'), msg = box.querySelector('.msg'), st = sstate[i] || (sstate[i] = {});
    const cells = [...box.querySelectorAll('.c')];
    if (b.dataset.act === 'check') {
      let wrong = 0, empty = 0;
      cells.forEach(c => { const k = +c.dataset.k, v = sdkVal(st, k); if (!v) empty++; else if (v !== d.solution[Math.floor(k / 9)][k % 9]) { wrong++; c.classList.add('bad'); } });
      msg.textContent = wrong ? L(wrong + ' wrong, marked in red.', wrong + ' erreur(s), en rouge.') : empty ? L('All correct so far. ', 'Tout est juste pour l\'instant. ') + L(empty + ' squares to go.', 'Encore ' + empty + ' cases.') : L('Solved. Well done.', 'Résolu. Bravo.');
    } else if (b.dataset.act === 'reveal') {
      const rev = jget(SDK_REV); if (!jget(SDK_DONE)['{{ISSUE_ID}}#' + i]) { rev['{{ISSUE_ID}}#' + i] = 1; jset(SDK_REV, rev); }
      cells.forEach(c => { const k = +c.dataset.k; st[k] = String(d.solution[Math.floor(k / 9)][k % 9]); delete st['n' + k]; c.classList.remove('bad'); });
      ls.set(ISSUE + '-sudoku', sstate); sdkPaint(box); msg.textContent = L('Answer revealed.', 'Solution affichée.');
    } else {
      sstate[i] = {}; cells.forEach(c => c.classList.remove('bad')); ls.set(ISSUE + '-sudoku', sstate); sdkPaint(box); msg.textContent = L('Cleared.', 'Effacé.');
    }
  }
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') goIdx(current() + 1);
    if (e.key === 'ArrowLeft') goIdx(current() - 1);
  });
  let rt, lastW = innerWidth, lastH = innerHeight;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (Math.abs(innerWidth - lastW) < 2 && Math.abs(innerHeight - lastH) < 80) return;
      lastW = innerWidth; lastH = innerHeight;
      const k = pages[current()] ? pages[current()].dataset.key : 'front';
      layout(k);
    }, 200);
  });

  // ---------- settings (kept on this phone) ----------
  const SET_K = 'tpt-settings', SET_DEF = { lang: 'en', text: 'm', theme: 'auto', scrub: '1.6' };
  function setGet() { let v = null; try { v = JSON.parse(localStorage.getItem(SET_K)); } catch (e) {} return Object.assign({}, SET_DEF, v || {}); }
  function applySettings(relayout) {
    const st = setGet();
    if (st.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', st.theme);
    document.documentElement.style.setProperty('--tz', { s: '0.9', m: '1', l: '1.13' }[st.text] || '1');
    scrubGain = parseFloat(st.scrub) || 1.6;
    document.querySelectorAll('#settings .seg').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === st[g.dataset.set]))));
    if (relayout) { const k = pages[current()] ? pages[current()].dataset.key : 'front'; layout(k); }
  }
  const sheet = document.getElementById('settings');
  pf.querySelector('.gear').onclick = () => {
    sheet.querySelector('.sh-info').textContent = L('Issue {{ISSUE_ID}} · screen ', 'Numéro {{ISSUE_ID}} · écran ') + screen.height + ' · app ' + app.offsetHeight + L(' · settings stay on this phone. Language applies to the next issue.', ' · réglages gardés sur ce téléphone. La langue s\'applique au prochain numéro.');
    sheet.hidden = false;
  };
  sheet.querySelector('.sh-close').onclick = () => { sheet.hidden = true; };
  pf.querySelector('.lib').onclick = () => { location.href = './?archive'; };
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.hidden = true; });
  sheet.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    const st = setGet(); const key = b.parentElement.dataset.set;
    if (st[key] === b.dataset.v) return;
    st[key] = b.dataset.v; try { localStorage.setItem(SET_K, JSON.stringify(st)); } catch (e) {}
    if (key === 'lang') { sendEvent({ a: 'pref', t: Date.now(), title: 'lang', note: b.dataset.v }); setTimeout(() => location.reload(), 400); return; }
    applySettings(key === 'text');
  });
  if (FR) {
    pfPrev.setAttribute('aria-label', 'Page précédente'); pfNext.setAttribute('aria-label', 'Page suivante'); pf.querySelector('.lib').setAttribute('aria-label', 'Tous les numéros'); const shl = sheet.querySelector('.sh-link span'); if (shl) shl.textContent = 'Tous les numéros';
    sheet.querySelector('h3').textContent = 'Réglages'; sheet.querySelector('.sh-close').textContent = 'OK';
    const rows = sheet.querySelectorAll('.sh-row > span'); ['Langue', 'Taille du texte', 'Thème', 'Vitesse de défilement'].forEach((x, i) => { if (rows[i]) rows[i].textContent = x; });
    const lab = { s: 'Petit', m: 'Moyen', l: 'Grand', auto: 'Téléphone', light: 'Clair', dark: 'Sombre', '1': 'Lent', '1.6': 'Normal', '2.5': 'Rapide' };
    sheet.querySelectorAll('.seg button').forEach(b => { if (lab[b.dataset.v]) b.textContent = lab[b.dataset.v]; });
  }
  applySettings(false);

  buildToc();
  const deep = (() => { try { return new URLSearchParams(location.search).get('s'); } catch (e) { return null; } })();
  const start = () => layout(deep && src.some(x => x.dataset.key === deep) ? deep : undefined);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
  start();
})();
</script>
