<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paul Times">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="manifest" href="manifest.webmanifest">
<title>The Paul Times</title>
<link rel="stylesheet" href="app.css?v=3">
<style>
body.home { overflow: hidden; }
body.home.scroll { overflow: auto; height: auto; min-height: 100%; }
.icon { width: 88px; height: 88px; border-radius: 22.5%; background: linear-gradient(160deg, #ff6259 0%, #ff3b30 45%, #d70015 100%);
  box-shadow: 0 1px 1px rgba(0,0,0,.08), 0 14px 30px -10px rgba(215,0,21,.55), inset 0 1px 0 rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center;
  color: #fff; font-family: var(--font-s); font-weight: 800; font-size: 46px; letter-spacing: -.04em; line-height: 1; position: relative; overflow: hidden; }
.icon::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: 20%; height: 3px; border-radius: 2px; background: rgba(255,255,255,.85); }
.icon span { transform: translateY(-4px); }

/* splash */
#splash { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  transition: opacity .5s var(--ease), transform .6s var(--ease); }
#splash .icon { animation: sp-icon .9s var(--spring) both; }
#splash .t { font-family: var(--font-s); font-weight: 800; font-size: 30px; letter-spacing: -.03em; animation: sp-up .8s var(--ease) .15s both; }
#splash .d { font-size: 15px; color: var(--ink2); font-weight: 500; animation: sp-up .8s var(--ease) .25s both; margin-top: -12px; }
#splash.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
@keyframes sp-icon { from { opacity: 0; transform: scale(.6); filter: blur(10px); } }
@keyframes sp-up { from { opacity: 0; transform: translateY(10px); } }

/* passcode */
#lock { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) 24px calc(env(safe-area-inset-bottom, 0px) + 20px); }
#lock[hidden], #lib[hidden] { display: none; }
#lock .icon { width: 64px; height: 64px; font-size: 33px; margin-bottom: 18px; }
#lock h1 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
#lock .sub { color: var(--ink2); font-size: 15px; margin-top: 4px; text-align: center; }
#lock .dots { display: flex; gap: 20px; margin: 26px 0 8px; }
#lock .dots i { width: 13px; height: 13px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink); transition: background .15s; }
#lock .dots i.on { background: var(--ink); }
#lock .dots.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(5px); } 30%, 50%, 70% { transform: translateX(-10px); } 40%, 60% { transform: translateX(10px); } }
#lock .msg { min-height: 20px; font-size: 14px; color: var(--red); font-weight: 500; margin-bottom: 18px; }
#lock .keys { display: grid; grid-template-columns: repeat(3, 78px); gap: 16px 26px; }
#lock .keys button { width: 78px; height: 78px; border-radius: 50%; border: 0; background: var(--fill); color: var(--ink); font-family: var(--font-d); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; transition: background .3s; -webkit-user-select: none; user-select: none; }
#lock .keys button:active { background: var(--ink3); transition: none; }
#lock .keys button b { font-size: 34px; font-weight: 400; }
#lock .keys button small { font-size: 10px; font-weight: 600; letter-spacing: .16em; margin-top: 3px; color: var(--ink2); }
#lock .keys button.ghost { background: none; font-size: 17px; font-family: var(--font); font-weight: 500; }
#lock .keys .sp { visibility: hidden; }
#lock .hide { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }

/* library: a newsstand of front pages */
#lib { max-width: 720px; margin: 0 auto; padding: 0 var(--gutr) calc(env(safe-area-inset-bottom, 0px) + 40px) var(--gut); box-sizing: border-box; font-family: var(--font); }
.nav { position: sticky; top: 0; z-index: 5; margin: 0 calc(-1 * var(--gutr)) 0 calc(-1 * var(--gut)); padding: calc(env(safe-area-inset-top, 0px) + 8px) var(--gutr) 8px var(--gut);
  display: flex; align-items: center; justify-content: space-between; min-height: 28px; background: transparent; transition: background .25s, border-color .25s; border-bottom: .5px solid transparent; }
.nav.solid { background: var(--bar); -webkit-backdrop-filter: saturate(1.8) blur(20px); backdrop-filter: saturate(1.8) blur(20px); border-bottom-color: var(--sep); }
.nav .st { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--font-s); font-weight: 800; font-size: 17px; opacity: 0; transition: opacity .2s; pointer-events: none; top: 0; line-height: 44px; height: 44px; margin-top: env(safe-area-inset-top, 0px); }
.nav.solid .st { opacity: 1; }
.nav a, .nav button { font: inherit; font-size: 17px; color: var(--accent); text-decoration: none; background: none; border: 0; padding: 8px 0; position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.nav a svg { width: 20px; height: 20px; }
.lt { font-family: var(--font-s); font-size: 40px; font-weight: 800; letter-spacing: -.02em; margin: 6px 0 0; border-bottom: 2px solid var(--rule); padding-bottom: 8px; }
.ltsub { font-family: var(--font-s); font-style: italic; color: var(--ink2); font-size: 16px; margin: 6px 0 16px; }
.search { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 11px; padding: 0 10px; height: 38px; margin-bottom: 24px; }
.search svg { width: 17px; height: 17px; color: var(--ink2); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 17px; color: var(--ink); outline: none; }
.search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
.search input::placeholder { color: var(--ink2); }
.search .clr { display: none; width: 18px; height: 18px; border-radius: 50%; border: 0; background: var(--ink3); color: var(--bg); font-size: 11px; line-height: 18px; padding: 0; cursor: pointer; }
.search.has .clr { display: block; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }

/* today's paper: a miniature front page */
.cover { display: block; color: inherit; text-decoration: none; background: var(--bg); cursor: pointer; transition: transform .35s var(--spring), box-shadow .35s; }
.cover:active { transform: scale(.985); }
.feat { border-radius: 6px; box-shadow: 0 0 0 .5px var(--sep), 0 18px 40px -22px rgba(0,0,0,.45); padding: 16px 16px 18px; margin-bottom: 30px; }
.cover .mh { text-align: center; }
.cover .dl { display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink2); border-bottom: .5px solid var(--sep); padding-bottom: 6px; margin-bottom: 8px; }
.cover .np { font-family: var(--font-s); font-weight: 900; font-size: 38px; line-height: 1; letter-spacing: -.025em; }
.cover .rl { border-top: 2px solid var(--rule); margin: 10px 0 12px; }
.cover .img { aspect-ratio: 16 / 10; background: var(--fill2); overflow: hidden; margin: 0 -16px 12px; position: relative; }
.cover .img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; animation: fadein .7s var(--ease) both; }
.cover .k { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.cover h2 { font-family: var(--font-s); font-size: 27px; font-weight: 800; letter-spacing: -.02em; line-height: 1.08; margin: 5px 0 8px; }
.cover p.dk { font-family: var(--font-s); color: var(--ink2); font-size: 16px; line-height: 1.45; }
.cover .go { display: flex; gap: 10px; margin-top: 16px; }
.btn { font: 600 15px var(--font); border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.fill { background: var(--ink); color: var(--bg); }
.btn.tint { background: var(--fill); color: var(--ink); }
.gh { font-family: var(--font-s); font-size: 24px; font-weight: 800; letter-spacing: -.015em; margin: 0 0 14px; border-bottom: 2px solid var(--rule); padding-bottom: 6px; }
.stand { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 14px; margin-bottom: 32px; }
@media (min-width: 640px) { .stand { grid-template-columns: repeat(3, 1fr); } }
.mini { border-radius: 4px; box-shadow: 0 0 0 .5px var(--sep), 0 12px 26px -18px rgba(0,0,0,.5); padding: 9px 9px 11px; display: flex; flex-direction: column; }
.mini .dl { font-size: 7.5px; padding-bottom: 4px; margin-bottom: 5px; }
.mini .np { font-size: 17px; }
.mini .rl { border-top-width: 1.5px; margin: 6px 0 7px; }
.mini .img { aspect-ratio: 4 / 3; margin: 0 -9px 8px; }
.mini h2 { font-size: 14.5px; line-height: 1.16; margin: 2px 0 0; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.mini .k { font-size: 9px; }
.minicap { font-size: 12.5px; color: var(--ink2); margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.minicap b { color: var(--ink); font-weight: 600; }
.minicap .ed { color: var(--accent); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.minicap button { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 2px 0; cursor: pointer; font-weight: 600; }
.res { border-top: 2px solid var(--rule); }
.hit { display: block; padding: 13px 0; border-bottom: .5px solid var(--sep); color: inherit; text-decoration: none; }
.hit .m { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.hit .m span { color: var(--ink2); font-weight: 600; }
.hit .h { font-family: var(--font-s); font-size: 19px; font-weight: 700; line-height: 1.22; margin-top: 3px; }
.hit .h mark { background: color-mix(in srgb, var(--accent) 20%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.hit:active .h { color: var(--accent); }
.empty { text-align: center; color: var(--ink2); padding: 40px 10px; font-size: 15px; }
.foot { text-align: center; color: var(--ink3); font-size: 12.5px; margin-top: 8px; }
@keyframes fadein { from { opacity: 0; } }

/* issue sheet */
#sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0); transition: background .35s var(--ease); }
#sheet.on { background: rgba(0,0,0,.4); }
#sheet .sh { position: absolute; left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top, 0px) + 12px); background: var(--bg); border-radius: 14px 14px 0 0; overflow-y: auto;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain; transform: translateY(100%); transition: transform .5s var(--ease); max-width: 680px; margin: 0 auto;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); box-shadow: 0 -10px 40px -10px rgba(0,0,0,.4); }
#sheet.on .sh { transform: none; }
#sheet .gr { position: sticky; top: 0; z-index: 2; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 18px;
  background: var(--bar); -webkit-backdrop-filter: saturate(1.8) blur(20px); backdrop-filter: saturate(1.8) blur(20px); border-bottom: .5px solid var(--sep); font-weight: 600; font-size: 17px; }
#sheet .gr::before { content: ""; position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--ink3); }
#sheet .x { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--fill); color: var(--ink2); font-size: 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
#sheet .in { padding: 16px var(--gutr) 0 var(--gut); }
#sheet .hero { aspect-ratio: 16 / 10; overflow: hidden; background: var(--fill2); margin: -16px calc(-1 * var(--gutr)) 16px calc(-1 * var(--gut)); }
#sheet .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
#sheet .k { font-family: var(--font); color: var(--accent); font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
#sheet h2 { font-family: var(--font-s); font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.08; margin: 4px 0 8px; }
#sheet .dek { font-family: var(--font-s); color: var(--ink2); font-size: 17px; line-height: 1.45; }
#sheet .go { margin: 16px 0 24px; }
#sheet .go .btn { width: 100%; justify-content: center; padding: 14px; font-size: 17px; border-radius: 14px; box-sizing: border-box; }
#sheet .gr span { font-family: var(--font-s); font-weight: 800; }
#sheet h3 { font-family: var(--font); font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
#sheet .card { background: var(--bg2); border-radius: 16px; padding: 14px 16px; margin-bottom: 26px; }
#sheet .five { background: none; padding: 0; border-top: 2px solid var(--rule); border-radius: 0; }
#sheet .five p { position: relative; padding: 10px 0 10px 32px; font-family: var(--font-s); font-size: 16.5px; line-height: 1.38; border-bottom: .5px solid var(--sep); }

#sheet .five b { position: absolute; left: 0; top: 8px; font-family: var(--font-s); font-size: 22px; font-weight: 800; color: var(--accent); line-height: 1; }
#sheet .nod { display: block; }
#sheet .nod .lb { display: block; color: var(--accent); letter-spacing: .05em; text-transform: uppercase; font-size: 12px !important; font-weight: 700 !important; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
#sheet .nod .big { display: block; font-family: var(--font-d); font-weight: 700; font-size: 56px; color: var(--ink); letter-spacing: -.03em; line-height: 1; margin-bottom: 8px; }
#sheet .nod p { font-size: 14.5px; color: var(--ink2); line-height: 1.38; }
.secs { border-top: 2px solid var(--rule); margin-bottom: 18px; }
.sec { border-bottom: .5px solid var(--sep); }
.sec > button { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: baseline; gap: 14px; padding: 12px 0; cursor: pointer; }
.sec .ic { font-family: var(--font-s); font-weight: 800; font-size: 20px; min-width: 26px; }
.sec .tt { flex: 1; font-family: var(--font-s); font-size: 21px; font-weight: 700; letter-spacing: -.012em; }
.sec .ct { color: var(--ink2); font-size: 14px; }
.sec .ch { color: var(--ink3); font-size: 18px; transition: transform .3s var(--ease); display: inline-block; }
.sec.open .ch { transform: rotate(90deg); }
.sec ul { list-style: none; margin: 0; padding: 0 0 8px 40px; display: none; }
.sec.open ul { display: block; }
.sec li { padding: 8px 0; font-family: var(--font-s); font-size: 16px; line-height: 1.32; border-top: .5px solid var(--sep2); cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.sec li::after { content: "›"; color: var(--ink3); font-family: var(--font); }
.sec li:active { color: var(--accent); }
@media (min-width: 700px) { .feat .img { aspect-ratio: 2 / 1; } }
</style></head>
<body class="home">
<div id="splash" aria-hidden="true"><div class="icon"><span>P</span></div><div class="t">The Paul Times</div><div class="d" id="sd"></div></div>

<div id="lock" hidden>
  <div class="icon"><span>P</span></div>
  <h1 id="lkh">Enter Passcode</h1>
  <div class="sub" id="lks">The Paul Times</div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="msg" id="lkm" aria-live="polite"></div>
  <div class="keys" id="keys"></div>
  <input class="hide" id="hk" inputmode="numeric" autocomplete="off" aria-label="Passcode">
</div>

<div id="lib" hidden>
  <div class="nav" id="nav"><a href="./" id="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>Today</span></a><div class="st">Library</div><span></span></div>
  <h1 class="lt">Library</h1>
  <div class="ltsub" id="lsub"></div>
  <label class="search" id="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg>
    <input id="q" type="search" placeholder="Search every headline" autocomplete="off" enterkeyhint="search"><button class="clr" id="qc" aria-label="Clear">✕</button></label>
  <div id="libv"></div>
</div>

<script>
(async function () {
  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
  const FR = (() => { try { return (JSON.parse(store.get('tpt-settings')) || {}).lang === 'fr'; } catch (e) { return false; } })();
  const L = (en, fr) => FR ? fr : en;
  const st = (() => { try { return JSON.parse(store.get('tpt-settings')) || {}; } catch (e) { return {}; } })();
  if (st.theme === 'light' || st.theme === 'dark') document.documentElement.setAttribute('data-theme', st.theme);
  const esc = x => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const get = async p => { const r = await fetch(p + (p.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error(p + ' ' + r.status); return r.json(); };
  const loc = FR ? 'fr-FR' : 'en-GB';
  const fmt = (i, o) => new Date(i.date + 'T12:00:00').toLocaleDateString(loc, o || { weekday: 'short', day: 'numeric', month: 'short' });
  const t0 = Date.now(), wantLib = qs.has('archive');
  const minSplash = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : (wantLib ? 450 : 1100);
  const splashReady = () => new Promise(r => setTimeout(r, Math.max(0, minSplash - (Date.now() - t0))));
  const splashOut = () => { const e = $('splash'); if (!e) return; e.classList.add('out'); setTimeout(() => e.remove(), 600); };
  $('sd').textContent = new Date().toLocaleDateString(loc, { weekday: 'long', day: 'numeric', month: 'long' });

  let list = [], cfg;
  try { [list, cfg] = await Promise.all([get('issues.json'), get('crypto.json')]); }
  catch (e) { await splashReady(); $('sd').textContent = L('Could not load the paper. Check your connection.', 'Impossible de charger le journal. Vérifie ta connexion.'); return; }

  const KEYNAME = 'tpt-key-' + cfg.salt;
  async function deriveKey(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(cfg.salt), iterations: cfg.iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function savedKey() { const raw = store.get(KEYNAME); return raw ? crypto.subtle.importKey('raw', b64(raw), { name: 'AES-GCM' }, true, ['decrypt']) : null; }
  const dec = async (key, o) => new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(o.iv) }, key, b64(o.ct)));
  async function openIssue(key, issue) { return dec(key, await get('issues/' + issue.id + '.enc')); }

  function show(html) {
    // Every issue gets the current design layer and the tap-for-more sheet, even ones built before they existed.
    const inject = (h, tag, where) => (new RegExp('</' + where + '>', 'i')).test(h) ? h.replace(new RegExp('</' + where + '>(?![\\s\\S]*</' + where + '>)', 'i'), tag + '</' + where + '>') : h + tag;
    if (!html.includes('screen-overlay.js')) html = inject(html, '<script src="screen-overlay.js?v=4"><\/script>', 'body');
    if (!html.includes('app.css')) { html = inject(html, '<link rel="stylesheet" href="app.css?v=3">', 'head'); html = inject(html, '<script src="app.js?v=3"><\/script>', 'body'); }
    html = inject(html, '<style>@keyframes tpt-in{from{opacity:0;transform:scale(.985)}}body{animation:tpt-in .55s cubic-bezier(.22,1,.36,1) both}</style>', 'head');
    splashReady().then(() => { const s = $('splash'); if (s) s.classList.add('out'); setTimeout(() => { document.open(); document.write(html); document.close(); }, s ? 280 : 0); });
  }

  // ---------------- passcode ----------------
  function lock(next, message) {
    splashReady().then(splashOut);
    const box = $('lock'); box.hidden = false; $('lib').hidden = true;
    const latest = list[0];
    $('lkh').textContent = L('Enter Passcode', 'Code d\'accès');
    $('lks').textContent = latest ? 'The Paul Times · ' + fmt(latest, { weekday: 'long', day: 'numeric', month: 'long' }) + (latest.no ? ' · No. ' + latest.no : '') : 'The Paul Times';
    const letters = ['', 'ABC', 'DEF', 'GHI', 'JKL', 'MNO', 'PQRS', 'TUV', 'WXYZ'];
    $('keys').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-n="${n}"><b>${n}</b><small>${letters[n - 1] || '&nbsp;'}</small></button>`).join('')
      + `<button class="sp" tabindex="-1"></button><button data-n="0"><b>0</b><small>&nbsp;</small></button><button class="ghost" data-del>${L('Delete', 'Effacer')}</button>`;
    const dots = $('dots'), msg = $('lkm'); let code = '', busy = false;
    msg.textContent = message || '';
    const paint = () => { [...dots.children].forEach((d, i) => d.classList.toggle('on', i < code.length)); $('keys').querySelector('[data-del]').textContent = code ? L('Delete', 'Effacer') : ''; };
    async function tryCode() {
      busy = true; msg.textContent = '';
      try {
        const key = await deriveKey(code);
        const html = latest ? await openIssue(key, wantLib ? latest : (list.find(i => i.id === qs.get('d')) || latest)) : '';
        const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
        store.set(KEYNAME, btoa(String.fromCharCode(...raw)));
        try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}
        next(key, html);
      } catch (e) {
        dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
        try { navigator.vibrate && navigator.vibrate([30, 40, 30]); } catch (e) {}
        msg.textContent = L('Wrong passcode', 'Code incorrect'); code = ''; paint();
      } finally { busy = false; }
    }
    const press = n => { if (busy) return; if (n === 'del') code = code.slice(0, -1); else if (code.length < 4) code += n; paint(); if (code.length === 4) setTimeout(tryCode, 120); };
    $('keys').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.del !== undefined) press('del'); else if (b.dataset.n) press(b.dataset.n); };
    document.onkeydown = e => { if ($('lock').hidden) return; if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); };
    paint();
  }

  // ---------------- library ----------------
  const ACC = { front: '--a-front', world: '--a-world', france: '--a-france', local: '--a-local', markets: '--a-markets', crypto: '--a-crypto', tech: '--a-tech', craft: '--a-craft', sport: '--a-sport', screen: '--a-screen', week: '--a-week', sunday: '--a-week', back: '--a-back' };
  const PH = 'tpt-libph-';
  async function photoUrl(p) {
    if (!p) return null;
    if (p.src) return p.src;
    const spec = p.wiki || '', ck = PH + spec; const c = store.get(ck); if (c) return c;
    try {
      if (p.file) return null;
      const [lang, title] = spec.split('|');
      const d = await (await fetch('https://' + lang + '.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=800&redirects=1&titles=' + encodeURIComponent(title))).json();
      const pg = Object.values((d.query && d.query.pages) || {})[0]; const u = pg && pg.thumbnail && pg.thumbnail.source;
      if (u) store.set(ck, u); return u || null;
    } catch (e) { return null; }
  }
  function putImg(box, url) { if (!url || !box) return; const img = new Image(); img.referrerPolicy = 'no-referrer'; img.alt = ''; img.onload = () => { if (box.querySelector('.badge')) box.prepend(img); else { box.textContent = ''; box.appendChild(img); } }; img.src = url; }
  const head = i => (i.toc && i.toc.lead) || i.title || L('Issue', 'Numéro');
  const edLabel = i => i.edition === 'weekly' ? L('Weekly', 'Hebdo') : (new Date(i.date + 'T12:00').getDay() === 0 ? L('Sunday', 'Dimanche') : '');

  async function library(key) {
    splashReady().then(splashOut);
    document.body.classList.add('scroll');
    $('lock').hidden = true; const lib = $('lib'); lib.hidden = false;
    $('today').querySelector('span').textContent = L('Today', 'Aujourd\'hui');
    lib.querySelector('.lt').textContent = L('Library', 'Bibliothèque'); lib.querySelector('.nav .st').textContent = L('Library', 'Bibliothèque');
    $('q').placeholder = L('Search every headline', 'Chercher dans tous les titres');
    // decrypt every issue's contents (small, cached for the session)
    await Promise.all(list.map(async i => { if (i.toc && i.toc.ct && key) { try { i.toc = JSON.parse(await dec(key, i.toc)); } catch (e) { i.toc = null; } } else if (i.toc && i.toc.ct) i.toc = null; }));
    const n = list.length;
    $('lsub').textContent = n + ' ' + (n === 1 ? L('issue', 'numéro') : L('issues', 'numéros')) + (n ? ' · ' + L('since', 'depuis') + ' ' + fmt(list[n - 1], { day: 'numeric', month: 'long', year: 'numeric' }) : '');
    const nav = $('nav'); addEventListener('scroll', () => nav.classList.toggle('solid', scrollY > 44), { passive: true });
    render('');
    const q = $('q'), sb = $('sbox'); let qt = 0;
    q.oninput = () => { sb.classList.toggle('has', !!q.value); clearTimeout(qt); qt = setTimeout(() => render(q.value.trim()), 120); };
    $('qc').onclick = e => { e.preventDefault(); q.value = ''; sb.classList.remove('has'); render(''); q.focus(); };
    if (qs.get('i')) { const it = list.find(x => x.id === qs.get('i')); if (it) openSheet(it); }
  }
  const url = (i, s) => './?d=' + encodeURIComponent(i.id) + (s ? '&s=' + encodeURIComponent(s) : '');
  const coverHtml = (i, idx, big) => {
    const t = i.toc || {}, no = i.no || t.no;
    const d1 = fmt(i, { weekday: big ? 'long' : 'short', day: 'numeric', month: big ? 'long' : 'short' });
    return `<div class="mh"><div class="dl"><span>${esc(edLabel(i) || L('Daily', 'Quotidien'))}${no ? ' · No. ' + esc(no) : ''}</span><span>${esc(d1)}</span></div>
      <div class="np">The Paul Times</div><div class="rl"></div></div>
      ${t.photo ? `<div class="img" data-ph="${idx}"></div>` : ''}
      ${t.kicker ? `<div class="k">${esc(t.kicker.replace(/^Breaking\s*·\s*/i, ''))}</div>` : ''}<h2>${esc(head(i))}</h2>`;
  };
  function rowHtml(i, idx) {
    const t = i.toc || {}, e = edLabel(i);
    return `<div><a class="cover mini row" href="${url(i)}" data-i="${idx}">${coverHtml(i, idx, false)}</a>
      <div class="minicap"><span><b>${esc(fmt(i, { weekday: 'short', day: 'numeric', month: 'short' }))}</b>${e ? ` <span class="ed">${esc(e)}</span>` : ''}</span><button data-sheet="${idx}">${L('Contents', 'Sommaire')}</button></div></div>`;
  }
  function render(q) {
    const v = $('libv');
    if (!list.length) { v.innerHTML = `<p class="empty">${L('No issues yet. The first one arrives at 07:00.', 'Pas encore de numéro. Le premier arrive à 7 h.')}</p>`; return; }
    if (q) return renderSearch(q);
    const [top, ...rest] = list, t = top.toc || {};
    let h = `<p class="eyebrow">${L("Today's paper", 'Le journal du jour')}</p><a class="cover feat" href="${url(top)}" data-i="0">${coverHtml(top, 0, true)}
      ${t.dek ? `<p class="dk">${esc(t.dek)}</p>` : ''}
      <div class="go"><span class="btn fill">${L('Read', 'Lire')}</span><button class="btn tint" data-sheet="0">${L('In this issue', 'Au sommaire')}</button></div></a>`;
    const groups = {};
    rest.forEach((i, k) => { const g = new Date(i.date + 'T12:00').toLocaleDateString(loc, { month: 'long', year: 'numeric' }); (groups[g] = groups[g] || []).push([i, k + 1]); });
    for (const g in groups) h += `<h2 class="gh">${esc(g.charAt(0).toUpperCase() + g.slice(1))}</h2><div class="stand">${groups[g].map(([i, k]) => rowHtml(i, k)).join('')}</div>`;
    h += `<p class="foot">${L('Tap a front page to read it, or Contents to see every headline inside.', 'Touche une une pour la lire, ou Sommaire pour voir tous les titres.')}</p>`;
    v.innerHTML = h;
    v.querySelectorAll('[data-ph]').forEach(b => { const k = +b.dataset.ph; const t2 = list[k].toc; if (t2 && t2.photo) photoUrl(t2.photo).then(u => putImg(b, u)); });
    bindRows(v);
  }
  function bindRows(v) {
    v.querySelectorAll('[data-sheet]').forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); openSheet(list[+b.dataset.sheet]); });
    v.querySelectorAll('.row').forEach(r => { let t = 0; r.addEventListener('touchstart', () => { t = setTimeout(() => { t = -1; openSheet(list[+r.dataset.i]); }, 450); }, { passive: true });
      r.addEventListener('touchend', e => { if (t === -1) e.preventDefault(); clearTimeout(t); }); r.addEventListener('touchmove', () => clearTimeout(t), { passive: true }); r.addEventListener('contextmenu', e => e.preventDefault()); });
  }
  function renderSearch(q) {
    const v = $('libv'), words = q.toLowerCase().split(/\s+/).filter(Boolean), hits = [];
    const match = s => { const l = (s || '').toLowerCase(); return words.every(w => l.includes(w)); };
    const mark = s => { let out = esc(s); words.forEach(w => { const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'); out = out.replace(re, '<mark>$1</mark>'); }); return out; };
    list.forEach((i, k) => {
      const t = i.toc || {};
      if (match(head(i)) || match(t.dek)) hits.push({ i, k, s: 'front', title: L('Front page', 'À la une'), h: head(i) });
      (t.sections || []).forEach(sec => sec.heads.forEach(h => { if (match(h)) hits.push({ i, k, s: sec.key, title: sec.title, acc: sec.accent, h }); }));
    });
    if (!hits.length) { v.innerHTML = `<p class="empty">${L('No headline matches', 'Aucun titre ne correspond à')} “${esc(q)}”.</p>`; return; }
    v.innerHTML = `<h2 class="gh">${hits.length} ${hits.length === 1 ? L('result', 'résultat') : L('results', 'résultats')}</h2><div class="res">` + hits.slice(0, 120).map(x =>
      `<a class="hit" href="${url(x.i, x.s === 'front' ? '' : x.s)}" style="--accent:var(${esc(x.acc || ACC[x.s] || '--a-front')})"><div class="m">${esc(x.title)} <span>· ${esc(fmt(x.i))}${(x.i.no || (x.i.toc && x.i.toc.no)) ? ' · No. ' + esc(x.i.no || x.i.toc.no) : ''}</span></div><div class="h">${mark(x.h)}</div></a>`).join('') + '</div>';
  }
  function openSheet(i) {
    if (!i) return;
    const t = i.toc || {}, el = document.createElement('div'); el.id = 'sheet';
    const secs = (t.sections || []).map((s, k) => `<div class="sec"><button data-k="${k}"><span class="ic" style="color:var(${esc(s.accent || ACC[s.key] || '--a-back')})">${k + 2}</span><span class="tt">${esc(s.title)}</span><span class="ct">${s.heads.length || ''}</span><span class="ch">›</span></button>
      <ul>${s.heads.map(h => `<li data-s="${esc(s.key)}">${esc(h)}</li>`).join('')}</ul></div>`).join('');
    el.innerHTML = `<div class="sh" role="dialog" aria-modal="true"><div class="gr"><span>${esc(fmt(i, { weekday: 'long', day: 'numeric', month: 'long' }))}</span><button class="x" aria-label="${L('Close', 'Fermer')}">✕</button></div><div class="in">
      ${t.photo ? '<div class="hero" id="shero"></div>' : ''}
      <div class="k">${(i.no || t.no) ? 'No. ' + esc(i.no || t.no) + ' · ' : ''}${esc(edLabel(i) || L('Daily', 'Quotidien'))}${t.kicker ? ' · ' + esc(t.kicker.replace(/^Breaking\s*·\s*/i, '')) : ''}</div>
      <h2>${esc(head(i))}</h2>${t.dek ? `<p class="dek">${esc(t.dek)}</p>` : ''}
      <div class="go"><a class="btn fill" href="${url(i)}">${L('Read this issue', 'Lire ce numéro')}</a></div>
      ${t.five && t.five.length ? `<h3>${L('The day in five lines', 'La journée en cinq lignes')}</h3><div class="card five">${t.five.map(p => `<p>${esc(p).replace(/^(\d)\s*/, '<b>$1</b>')}</p>`).join('')}</div>` : ''}
      ${t.number && t.number.big ? `<div class="card nod"><span class="lb">${L('Number of the day', 'Le chiffre du jour')}</span><span class="big">${esc(t.number.big)}</span><p>${esc(t.number.text)}</p></div>` : ''}
      ${secs ? `<h3>${L('In this issue', 'Au sommaire')}</h3><div class="secs">${secs}</div>` : `<p class="empty">${L('Contents are not available for this issue.', 'Sommaire indisponible pour ce numéro.')}</p>`}
    </div></div>`;
    document.body.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
    const close = () => { el.classList.remove('on'); setTimeout(() => el.remove(), 450); };
    el.querySelector('.x').onclick = close; el.addEventListener('click', e => { if (e.target === el) close(); });
    el.querySelectorAll('.sec > button').forEach(b => b.onclick = () => b.parentElement.classList.toggle('open'));
    el.querySelectorAll('.sec li').forEach(li => li.onclick = () => { location.href = url(i, li.dataset.s); });
    if (t.photo) photoUrl(t.photo).then(u => putImg($('shero'), u));
    const sh = el.querySelector('.sh'); let y0 = null, dy = 0;
    sh.addEventListener('touchstart', e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
    sh.addEventListener('touchmove', e => { if (y0 == null) return; dy = e.touches[0].clientY - y0; if (dy > 0) { sh.style.transition = 'none'; sh.style.transform = 'translateY(' + dy + 'px)'; } }, { passive: true });
    sh.addEventListener('touchend', () => { if (y0 == null) return; sh.style.transition = ''; sh.style.transform = ''; if (dy > 110) close(); y0 = null; });
  }

  // ---------------- route ----------------
  let key = null;
  try { key = await savedKey(); } catch (e) { store.del(KEYNAME); }
  if (wantLib) {
    if (key) return library(key);
    return lock(k => library(k));
  }
  if (!list.length) { await splashReady(); $('sd').textContent = L('No issue yet. The first one arrives at 07:00.', 'Pas encore de numéro. Le premier arrive à 7 h.'); return; }
  const issue = list.find(i => i.id === qs.get('d')) || list[0];
  $('sd').textContent = fmt(issue, { weekday: 'long', day: 'numeric', month: 'long' }) + (issue.no ? ' · No. ' + issue.no : '');
  if (key) { try { return show(await openIssue(key, issue)); } catch (e) { store.del(KEYNAME); } }
  lock((k, html) => show(html));
})();
</script>
</body></html>
